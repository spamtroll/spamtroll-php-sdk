name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/pest --colors=always

  qa:
    name: Quality (PHPStan + cs-fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install aspell (for peck)
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-en

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHP-CS-Fixer (dry-run)
        run: composer lint

      - name: PHPStan
        run: composer stan

      # Advisory only. Peck is a dictionary-based spell checker: every new
      # domain word (a symbol name, a backend error code) is a "misspelling"
      # until someone adds it to peck.json. Blocking merges on that punishes
      # unrelated pull requests for the dictionary's gaps, and the failure
      # mode is cosmetic. Run `composer peck` locally; fix real typos.
      - name: Peck (spell check, advisory)
        continue-on-error: true
        run: composer peck
